name: Frontend CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Run TypeScript type check
      run: npx tsc --noEmit

    - name: Run tests
      run: npm test

  build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build production bundle
      run: npm run build

    - name: Verify build output
      run: |
        test -f dist/index.html && echo "index.html exists"
        test -d dist/assets && echo "assets directory exists"
        test -f dist/data/index.json && echo "data index shipped"
        # 相对 base 校验：产物必须引用 ./assets/... 而非 /assets/...
        grep -q 'src="\./assets/' dist/index.html \
          && echo "relative base OK" \
          || { echo "::error::dist/index.html 未使用相对 base，GitHub Pages 子路径部署会 404"; exit 1; }